# ================================================================
#  AdminPanel — конфигурация
#  Цветовые коды: &a, &c, &l ... а также HEX-цвета в формате &#RRGGBB
#  После изменения файла выполните: /adminpanel reload
#  При ошибке в значении плагин использует безопасное значение
#  по умолчанию и пишет предупреждение в консоль.
# ================================================================

# Язык сообщений: секция messages.<язык>. Доступны: ru, en.
# Если секции выбранного языка нет, используется ru.
language: ru

# Писать в консоль каждое административное действие (аудит).
log-actions: true

# ----------------------------------------------------------------
#  Управление сервером: время и погода
# ----------------------------------------------------------------
server-control:
  # Миры, к которым применяются время и погода.
  # Пустой список [] — все обычные (NORMAL) миры сервера.
  worlds:
    - world
  # Время в тиках (0-23999): 1000 — утро, 6000 — полдень, 13000 — ночь, 18000 — полночь.
  day-time: 1000
  night-time: 13000
  # Сколько секунд держится установленная погода (1-86400).
  weather-duration: 600

# ----------------------------------------------------------------
#  GUI
# ----------------------------------------------------------------
gui:
  # Защита от случайных двойных кликов (миллисекунды, 0 — выключено).
  click-cooldown-ms: 250
  # Строка, добавляемая к описанию кнопки, если у администратора нет права на действие.
  no-access-lore: "&c✖ Недостаточно прав"
  sounds:
    enabled: true
    click: UI_BUTTON_CLICK
    deny: ENTITY_VILLAGER_NO
    volume: 0.7
    pitch: 1.0

# ----------------------------------------------------------------
#  Меню. У каждой кнопки:
#    enabled  — показывать ли кнопку (true/false)
#    slot     — номер слота (0..size-1)
#    material — материал предмета (см. Material в Bukkit API)
#    name     — название
#    lore     — описание (список строк)
#    glow     — эффект свечения
#  Действие кнопки определяется её ключом (heal, feed, ...), а НЕ названием.
#  Чтобы скрыть кнопку, поставьте enabled: false (не удаляйте секцию —
#  удалённая секция будет восстановлена значениями по умолчанию).
# ----------------------------------------------------------------
menus:
  # ------------------------- Главное меню -------------------------
  # Плейсхолдеры заголовка: {page}, {pages}, {online}
  main:
    title: "&4&lАдмин-панель &8| &7стр. {page}/{pages}"
    # Размер: 27, 36, 45 или 54 слота.
    size: 54
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
    # Слоты для голов игроков онлайн. Можно указывать числа и диапазоны "18-44".
    player-slots:
      - "18-44"
    # Шаблон головы игрока. Плейсхолдеры: {player}, {health}, {max_health}, {food},
    # {gamemode}, {world}, {ping}, {fly}
    player-head:
      name: "&e{player}"
      lore:
        - "&7Здоровье: &c{health}&7/&c{max_health}"
        - "&7Голод: &6{food}&7/&620"
        - "&7Режим: &b{gamemode}"
        - "&7Мир: &a{world}"
        - "&7Пинг: &f{ping} мс"
        - ""
        - "&eНажмите, чтобы открыть меню игрока"
    buttons:
      # --- Раздел администратора (действия над собой) ---
      admin-section:
        enabled: true
        slot: 0
        material: NETHER_STAR
        name: "&c&lРаздел администратора"
        lore:
          - "&7Действия над собой"
      heal:
        enabled: true
        slot: 2
        material: GOLDEN_APPLE
        name: "&aВосстановить здоровье"
        lore:
          - "&7Полностью восстанавливает здоровье"
          - "&7и тушит огонь."
      feed:
        enabled: true
        slot: 3
        material: COOKED_BEEF
        name: "&6Восстановить голод"
        lore:
          - "&7Полностью восстанавливает сытость."
      fly:
        enabled: true
        slot: 4
        material: FEATHER
        name: "&bПолёт: {fly}"
        lore:
          - "&7Включить или выключить полёт."
      gamemode:
        enabled: true
        slot: 5
        material: DIAMOND_SWORD
        name: "&dИгровой режим"
        lore:
          - "&7Текущий: &f{gamemode}"
          - "&eНажмите, чтобы выбрать режим"
      # --- Раздел управления сервером ---
      server-section:
        enabled: true
        slot: 9
        material: COMPARATOR
        name: "&9&lУправление сервером"
        lore:
          - "&7Миры: &f{worlds}"
      time-day:
        enabled: true
        slot: 11
        material: SUNFLOWER
        name: "&eУстановить день"
        lore:
          - "&7Применяется к мирам: &f{worlds}"
      time-night:
        enabled: true
        slot: 12
        material: CLOCK
        name: "&1Установить ночь"
        lore:
          - "&7Применяется к мирам: &f{worlds}"
      weather-clear:
        enabled: true
        slot: 14
        material: LIGHT_BLUE_DYE
        name: "&bЯсная погода"
        lore:
          - "&7Применяется к мирам: &f{worlds}"
      weather-rain:
        enabled: true
        slot: 15
        material: WATER_BUCKET
        name: "&3Дождь"
        lore:
          - "&7Применяется к мирам: &f{worlds}"
      weather-thunder:
        enabled: true
        slot: 16
        material: TRIDENT
        name: "&8Гроза"
        lore:
          - "&7Применяется к мирам: &f{worlds}"
      # --- Навигация ---
      previous-page:
        enabled: true
        slot: 45
        material: ARROW
        name: "&e← Предыдущая страница"
        lore:
          - "&7Страница {page}/{pages}"
      players-info:
        enabled: true
        slot: 48
        material: PLAYER_HEAD
        name: "&a&lИгроки онлайн: &f{online}"
        lore:
          - "&7Страница {page}/{pages}"
          - "&7Нажмите на голову игрока,"
          - "&7чтобы управлять им."
      close:
        enabled: true
        slot: 49
        material: BARRIER
        name: "&cЗакрыть"
        lore: []
      refresh:
        enabled: true
        slot: 50
        material: LIME_DYE
        name: "&aОбновить"
        lore:
          - "&7Обновить список игроков"
      next-page:
        enabled: true
        slot: 53
        material: ARROW
        name: "&eСледующая страница →"
        lore:
          - "&7Страница {page}/{pages}"

  # ------------------------- Меню игрока -------------------------
  # Плейсхолдеры (заголовок и кнопки): {player}, {health}, {max_health}, {food},
  # {gamemode}, {world}, {ping}, {fly}
  player:
    title: "&8Игрок: &0{player}"
    size: 27
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
    buttons:
      target-info:
        enabled: true
        slot: 4
        material: PLAYER_HEAD
        name: "&e&l{player}"
        lore:
          - "&7Здоровье: &c{health}&7/&c{max_health}"
          - "&7Голод: &6{food}&7/&620"
          - "&7Режим: &b{gamemode}"
          - "&7Полёт: {fly}"
          - "&7Мир: &a{world}"
          - "&7Пинг: &f{ping} мс"
      teleport-to:
        enabled: true
        slot: 10
        material: ENDER_PEARL
        name: "&dТелепортироваться к игроку"
        lore:
          - "&7Переместиться к &f{player}"
      teleport-here:
        enabled: true
        slot: 11
        material: ENDER_EYE
        name: "&5Телепортировать к себе"
        lore:
          - "&7Переместить &f{player} &7к вам"
      heal:
        enabled: true
        slot: 13
        material: GOLDEN_APPLE
        name: "&aВылечить игрока"
        lore:
          - "&7Восстановить здоровье &f{player}"
      feed:
        enabled: true
        slot: 14
        material: COOKED_BEEF
        name: "&6Накормить игрока"
        lore:
          - "&7Восстановить голод &f{player}"
      fly:
        enabled: true
        slot: 15
        material: FEATHER
        name: "&bПолёт игрока: {fly}"
        lore:
          - "&7Включить или выключить полёт"
      gamemode:
        enabled: true
        slot: 16
        material: DIAMOND_SWORD
        name: "&dИгровой режим игрока"
        lore:
          - "&7Текущий: &f{gamemode}"
          - "&eНажмите, чтобы выбрать режим"
      back:
        enabled: true
        slot: 18
        material: ARROW
        name: "&e← Назад"
        lore:
          - "&7Вернуться к списку игроков"
      close:
        enabled: true
        slot: 26
        material: BARRIER
        name: "&cЗакрыть"
        lore: []

  # ---------------------- Выбор игрового режима ----------------------
  # Плейсхолдеры: {player}, {gamemode}
  gamemode:
    title: "&8Режим игры: &0{player}"
    size: 27
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
    buttons:
      survival:
        enabled: true
        slot: 10
        material: IRON_SWORD
        name: "&aВыживание"
        lore:
          - "&7Текущий режим: &f{gamemode}"
      creative:
        enabled: true
        slot: 12
        material: GRASS_BLOCK
        name: "&eТворческий"
        lore:
          - "&7Текущий режим: &f{gamemode}"
      adventure:
        enabled: true
        slot: 14
        material: MAP
        name: "&6Приключение"
        lore:
          - "&7Текущий режим: &f{gamemode}"
      spectator:
        enabled: true
        slot: 16
        material: ENDER_EYE
        name: "&7Наблюдатель"
        lore:
          - "&7Текущий режим: &f{gamemode}"
      back:
        enabled: true
        slot: 18
        material: ARROW
        name: "&e← Назад"
        lore: []
      close:
        enabled: true
        slot: 26
        material: BARRIER
        name: "&cЗакрыть"
        lore: []

# ----------------------------------------------------------------
#  Серверные события
#  ID события — ключ секции (латиница, цифры, "_" и "-").
#  duration — длительность в секундах (1-604800).
#  start-message / stop-message — строка или список строк, рассылаются всем.
#  title / subtitle — необязательный титул при запуске.
#  Плейсхолдеры: {id}, {name}, {duration}, {remaining}
#  Плагин НЕ выполняет никаких консольных команд: другие плагины могут
#  реагировать на ServerEventStartEvent / ServerEventStopEvent.
# ----------------------------------------------------------------
server-events:
  double-xp:
    name: "&aДвойной опыт"
    duration: 900
    start-message:
      - "&8&m                                        "
      - "&a&lСобытие «{name}&a&l» началось!"
      - "&7Длительность: &f{duration}"
      - "&8&m                                        "
    stop-message: "&cСобытие «{name}&c» завершено. Спасибо за участие!"
    title: "{name}"
    subtitle: "&7Событие началось на &f{duration}"
    bossbar:
      enabled: true
      text: "{name} &7— осталось &f{remaining}"
      color: GREEN
      style: SOLID
  build-contest:
    name: "&6Конкурс построек"
    duration: 3600
    start-message: "&6&lНачался конкурс построек! &7У вас есть &f{duration}&7."
    stop-message: "&6Конкурс построек окончен! Результаты скоро объявят."
    title: "&6Конкурс построек"
    subtitle: "&7Время: &f{duration}"
    bossbar:
      enabled: true
      text: "&6Конкурс построек &7— &f{remaining}"
      color: YELLOW
      style: SEGMENTED_10
  pvp-hour:
    name: "&cЧас PvP"
    duration: 3600
    start-message: "&c&lНачался час PvP! &7Будьте осторожны."
    stop-message: "&cЧас PvP завершён."
    bossbar:
      enabled: false
      text: "{name} &7— &f{remaining}"
      color: RED
      style: SOLID

# ----------------------------------------------------------------
